<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0e1a;
      --card-bg: #141824;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #e5e7eb;
      --text-secondary: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .period-selector {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .period-info {
      flex: 1;
    }

    .period-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .period-dates {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary);
    }

    .period-controls {
      display: flex;
      gap: 8px;
    }

    .period-btn {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    .period-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.15);
    }

    .card-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-amount {
      font-size: 2rem;
      font-weight: 700;
    }

    .salary { color: var(--primary); }
    .expenses { color: var(--danger); }
    .savings { color: var(--success); }

    .edit-salary-btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      margin-left: auto;
      transition: all 0.2s;
    }

    .edit-salary-btn:hover {
      background: var(--primary);
      color: white;
    }

    .input-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 40px;
    }

    .input-section h2 {
      font-size: 1.5rem;
      margin-bottom: 24px;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    input, select {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      transition: border 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .export-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .export-btn {
      flex: 1;
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .import-btn {
      flex: 1;
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    .transactions-section h2 {
      font-size: 1.5rem;
      margin-bottom: 24px;
      color: var(--text);
    }

    .transaction-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .transaction-item:hover {
      transform: translateX(4px);
    }

    .transaction-info {
      flex: 1;
    }

    .transaction-description {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .transaction-category {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .transaction-amount {
      font-size: 1.25rem;
      font-weight: 700;
      margin-right: 16px;
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: var(--danger);
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state span {
      font-size: 4rem;
      display: block;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 2rem;
      }

      .card-amount {
        font-size: 1.5rem;
      }

      .period-selector {
        flex-direction: column;
        align-items: stretch;
      }

      .export-controls {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 Expense Tracker</h1>
      <p>Track your bi-weekly salary and savings</p>
    </header>

    <div class="period-selector">
      <div class="period-info">
        <div class="period-label">Current Pay Period</div>
        <div class="period-dates" id="period-dates">Dec 16 - Dec 29, 2025</div>
      </div>
      <div class="period-controls">
        <button class="period-btn" onclick="changePeriod(-1)">← Previous</button>
        <button class="period-btn" onclick="changePeriod(0)">Current</button>
        <button class="period-btn" onclick="changePeriod(1)">Next →</button>
      </div>
    </div>

    <div class="summary-cards">
      <div class="card">
        <div class="card-label">
          Bi-Weekly Salary
          <button class="edit-salary-btn" onclick="editSalary()">Edit</button>
        </div>
        <div class="card-amount salary" id="salary">$0.00</div>
      </div>
      <div class="card">
        <div class="card-label">Expenses</div>
        <div class="card-amount expenses" id="expenses">$0.00</div>
      </div>
      <div class="card">
        <div class="card-label">Savings</div>
        <div class="card-amount savings" id="savings">$0.00</div>
      </div>
    </div>

    <div class="input-section">
      <div class="export-controls">
        <button onclick="exportData()" class="btn export-btn">
          📥 Export Data
        </button>
        <button onclick="document.getElementById('import-file').click()" class="btn import-btn">
          📤 Import Data
        </button>
      </div>
      <input type="file" id="import-file" accept=".json" onchange="importData(event)" style="display: none;">
    </div>

    <div class="input-section">
      <h2>Add Expense</h2>
      <form id="transaction-form">
        <div class="form-grid">
          <input type="text" id="description" placeholder="Description (e.g., Groceries)" required>
          <input type="number" id="amount" placeholder="Amount" step="0.01" required>
          <select id="category" required>
            <option value="">Category</option>
            <option value="Food & Dining">Food & Dining</option>
            <option value="Transportation">Transportation</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills & Utilities">Bills & Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button type="submit" class="btn">Add Expense</button>
      </form>
    </div>

    <div class="transactions-section">
      <h2>Expenses This Period</h2>
      <div id="transactions-list"></div>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let salaries = JSON.parse(localStorage.getItem('salaries')) || {};
    let currentPeriodOffset = 0;

    function getBiWeeklyPeriod(offset = 0) {
      const today = new Date();
      const startOfYear = new Date(today.getFullYear(), 0, 1);
      const daysSinceStart = Math.floor((today - startOfYear) / (1000 * 60 * 60 * 24));
      const currentPeriodNum = Math.floor(daysSinceStart / 14);
      
      const targetPeriod = currentPeriodNum + offset;
      const periodStart = new Date(startOfYear);
      periodStart.setDate(periodStart.getDate() + (targetPeriod * 14));
      
      const periodEnd = new Date(periodStart);
      periodEnd.setDate(periodEnd.getDate() + 13);
      
      return {
        start: periodStart,
        end: periodEnd,
        key: `${periodStart.getFullYear()}-P${targetPeriod}`
      };
    }

    function formatDate(date) {
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function changePeriod(offset) {
      if (offset === 0) {
        currentPeriodOffset = 0;
      } else {
        currentPeriodOffset += offset;
      }
      updateDisplay();
    }

    function editSalary() {
      const period = getBiWeeklyPeriod(currentPeriodOffset);
      const current = salaries[period.key] || 0;
      const newSalary = prompt(`Enter your bi-weekly salary for ${formatDate(period.start)} - ${formatDate(period.end)}:`, current);
      
      if (newSalary !== null && !isNaN(newSalary)) {
        salaries[period.key] = parseFloat(newSalary);
        localStorage.setItem('salaries', JSON.stringify(salaries));
        updateDisplay();
      }
    }

    function updateDisplay() {
      const period = getBiWeeklyPeriod(currentPeriodOffset);
      
      document.getElementById('period-dates').textContent = 
        `${formatDate(period.start)} - ${formatDate(period.end)}`;
      
      const salary = salaries[period.key] || 0;
      
      const periodExpenses = transactions
        .filter(t => {
          const tDate = new Date(t.date);
          return tDate >= period.start && tDate <= period.end;
        })
        .reduce((sum, t) => sum + t.amount, 0);
      
      const savings = salary - periodExpenses;
      
      document.getElementById('salary').textContent = `$${salary.toFixed(2)}`;
      document.getElementById('expenses').textContent = `$${periodExpenses.toFixed(2)}`;
      document.getElementById('savings').textContent = `$${savings.toFixed(2)}`;
      
      renderTransactions(period);
    }

    function renderTransactions(period) {
      const periodTransactions = transactions.filter(t => {
        const tDate = new Date(t.date);
        return tDate >= period.start && tDate <= period.end;
      });

      if (periodTransactions.length === 0) {
        document.getElementById('transactions-list').innerHTML = `
          <div class="empty-state">
            <span>📊</span>
            <p>No expenses this period. Add your first one above!</p>
          </div>
        `;
        return;
      }

      document.getElementById('transactions-list').innerHTML = periodTransactions
        .map((transaction, index) => {
          const actualIndex = transactions.indexOf(transaction);
          return `
            <div class="transaction-item">
              <div class="transaction-info">
                <div class="transaction-description">${transaction.description}</div>
                <div class="transaction-category">${transaction.category} • ${new Date(transaction.date).toLocaleDateString()}</div>
              </div>
              <div class="transaction-amount expenses">
                -$${transaction.amount.toFixed(2)}
              </div>
              <button class="delete-btn" onclick="deleteTransaction(${actualIndex})">Delete</button>
            </div>
          `;
        })
        .reverse()
        .join('');
    }

    function addTransaction(e) {
      e.preventDefault();

      const description = document.getElementById('description').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;

      const transaction = {
        id: Date.now(),
        description,
        amount,
        category,
        date: new Date().toISOString()
      };

      transactions.push(transaction);
      localStorage.setItem('transactions', JSON.stringify(transactions));

      document.getElementById('transaction-form').reset();
      updateDisplay();
    }

    function deleteTransaction(index) {
      transactions.splice(index, 1);
      localStorage.setItem('transactions', JSON.stringify(transactions));
      updateDisplay();
    }

    function exportData() {
      const data = {
        transactions,
        salaries,
        exportDate: new Date().toISOString()
      };
      const dataStr = JSON.stringify(data, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `expense-tracker-${new Date().toISOString().split('T')[0]}.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (confirm(`Import data? This will replace your current data.`)) {
            transactions = imported.transactions || [];
            salaries = imported.salaries || {};
            localStorage.setItem('transactions', JSON.stringify(transactions));
            localStorage.setItem('salaries', JSON.stringify(salaries));
            updateDisplay();
            alert('Data imported successfully!');
          }
        } catch (error) {
          alert('Error importing file. Please ensure it\'s a valid JSON file.');
        }
      };
      reader.readAsText(file);
    }

    document.getElementById('transaction-form').addEventListener('submit', addTransaction);

    // Initialize
    updateDisplay();

    // Prompt for salary if not set
    const currentPeriod = getBiWeeklyPeriod(0);
    if (!salaries[currentPeriod.key]) {
      setTimeout(() => {
        const salary = prompt('Welcome! Enter your bi-weekly salary to get started:');
        if (salary && !isNaN(salary)) {
          salaries[currentPeriod.key] = parseFloat(salary);
          localStorage.setItem('salaries', JSON.stringify(salaries));
          updateDisplay();
        }
      }, 500);
    }
  </script>
</body>
</html>
