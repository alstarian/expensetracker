<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker - Secure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
  color: #fff;
  min-height: 100vh;
}

.app-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: linear-gradient(135deg, rgba(10,10,10,.95) 0%, rgba(0,0,0,.98) 100%);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,.1);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 1001;
}

.app-logo {
  font-size: 2.5rem;
  animation: float 3s ease-in-out infinite;
}

.app-title {
  font-size: 1.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.container {
  max-width: 1200px;
  width: 100%;
  margin: 100px auto 80px auto;
  padding: 0 20px;
}

.sync-bar {
  background: rgba(255,255,255,.03);
  backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 30px;
}

.sync-btn {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.15);
  color: white;
  padding: 10px 20px;
  border-radius: 10px;
  cursor: pointer;
  font-size: .9rem;
  font-weight: 600;
  transition: all .3s;
}

.sync-btn:hover {
  background: rgba(255,255,255,.15);
  transform: translateY(-2px);
}

.sync-btn.settings {
  background: linear-gradient(135deg, rgba(139,92,246,.25), rgba(139,92,246,.15));
  border-color: rgba(139,92,246,.4);
}

.sync-btn.danger {
  background: linear-gradient(135deg, rgba(239,68,68,.25), rgba(239,68,68,.15));
  border-color: rgba(239,68,68,.4);
}

.pane {
  background: linear-gradient(135deg, rgba(30,30,30,.95) 0%, rgba(15,15,15,.98) 100%);
  backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 24px;
  padding: 36px;
  box-shadow: 0 24px 64px rgba(0,0,0,.5);
  position: relative;
  overflow: hidden;
  margin-bottom: 30px;
}

.pane-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.pane-title {
  font-size: 1.4rem;
  font-weight: 700;
  color: #fff;
}

.summary {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.summary-item {
  background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
  padding: 18px;
  border-radius: 14px;
  text-align: center;
  border: 1px solid rgba(255,255,255,.1);
}

.summary-item.full-width {
  grid-column: 1/-1;
}

.summary-label {
  font-size: .65rem;
  color: rgba(255,255,255,.6);
  margin-bottom: 8px;
  text-transform: uppercase;
}

.summary-value {
  font-size: 1.6rem;
  font-weight: 800;
  color: #fff;
}

.input-group {
  margin-bottom: 16px;
  position: relative;
}

.input-label {
  font-size: .75rem;
  color: rgba(255,255,255,.7);
  margin-bottom: 8px;
  display: block;
  font-weight: 600;
  text-transform: uppercase;
}

input, select {
  width: 100%;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px;
  padding: 12px 14px;
  color: #fff;
  font-size: .95rem;
  font-family: inherit;
  transition: all .3s;
}

input::placeholder {
  color: rgba(255,255,255,.35);
}

input:focus, select:focus {
  outline: 0;
  background: rgba(255,255,255,.1);
  border-color: rgba(255,255,255,.25);
  box-shadow: 0 0 0 4px rgba(255,255,255,.05);
}

.btn {
  width: 100%;
  background: linear-gradient(135deg, #fff, #f0f0f0);
  color: #0a0a0a;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-size: .85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .3s;
  text-transform: uppercase;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(255,255,255,.2);
}

.expenses-list {
  max-height: 400px;
  overflow-y: auto;
  margin-top: 20px;
}

.expense-item {
  background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
  padding: 14px 16px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid rgba(255,255,255,.08);
  margin-bottom: 10px;
}

.expense-info {
  flex: 1;
}

.expense-desc {
  font-size: .95rem;
  font-weight: 600;
  color: #fff;
  margin-bottom: 4px;
}

.expense-cat {
  font-size: .75rem;
  color: rgba(255,255,255,.5);
}

.expense-amount {
  font-size: 1.1rem;
  font-weight: 700;
  color: #fff;
  text-align: right;
  min-width: 80px;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: rgba(255,255,255,.35);
}

.empty-state-icon {
  font-size: 3rem;
  margin-bottom: 16px;
  opacity: .5;
}

.modal {
  display: none;
  position: fixed;
  z-index: 2000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,.85);
  backdrop-filter: blur(10px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.active {
  display: flex;
  animation: slideIn .3s ease;
}

@keyframes slideIn {
  from { transform: translateY(100px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

.shake-error {
  animation: shake .5s;
}

.modal-content {
  background: linear-gradient(135deg, rgba(30,30,30,.98) 0%, rgba(15,15,15,.98) 100%);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 24px;
  padding: 40px;
  max-width: 500px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 32px 96px rgba(0,0,0,.7);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}

.modal-title {
  font-size: 1.8rem;
  font-weight: 700;
  color: #fff;
}

.close-btn {
  background: rgba(239,68,68,.2);
  border: 1px solid rgba(239,68,68,.3);
  color: #ef4444;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .3s;
}

.close-btn:hover {
  background: rgba(239,68,68,.3);
  transform: rotate(90deg);
}

.modal-buttons {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}

.modal-btn {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  font-size: .9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .3s;
  text-transform: uppercase;
  border: none;
}

.modal-btn.cancel {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  color: white;
}

.modal-btn.cancel:hover {
  background: rgba(255,255,255,.15);
}

.modal-btn.save {
  background: linear-gradient(135deg, #10b981, #059669);
  color: white;
}

.modal-btn.save:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(16,185,129,.4);
}

.error-message {
  color: #ef4444;
  font-size: .9rem;
  padding: 12px;
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.3);
  border-radius: 8px;
  margin-bottom: 15px;
  display: none;
}

.error-message.show {
  display: block;
}

.success-message {
  color: #10b981;
  font-size: .9rem;
  padding: 12px;
  background: rgba(16,185,129,.1);
  border: 1px solid rgba(16,185,129,.3);
  border-radius: 8px;
  margin-bottom: 15px;
  display: none;
}

.success-message.show {
  display: block;
}

#lock-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  flex-direction: column;
  gap: 30px;
}

.lock-container {
  text-align: center;
  padding: 40px;
  background: rgba(0,0,0,.5);
  border-radius: 24px;
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.1);
  max-width: 400px;
}

.lock-icon {
  font-size: 60px;
  margin-bottom: 20px;
  animation: float 3s ease-in-out infinite;
}

.lock-title {
  font-size: 1.6rem;
  font-weight: 600;
  margin-bottom: 30px;
}

.passcode-inputs {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
}

.passcode-digit {
  width: 50px;
  height: 60px;
  font-size: 1.8rem;
  text-align: center;
  border: 2px solid rgba(255,255,255,.2);
  border-radius: 12px;
  background: rgba(255,255,255,.05);
  color: #fff;
  font-weight: 700;
}

.passcode-digit:focus {
  outline: none;
  border-color: #fbbf24;
  background: rgba(251,191,36,.1);
  box-shadow: 0 0 20px rgba(251,191,36,.3);
  transform: scale(1.1);
}

.passcode-digit.filled {
  border-color: #fbbf24;
}

.lock-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 20px;
}

.unlock-btn {
  background: linear-gradient(135deg, #00d4ff, #0099cc);
  color: #fff;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all .3s;
}

.unlock-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,212,255,.3);
}

.forgot-btn {
  background: transparent;
  border: 2px solid #fbbf24;
  color: #fbbf24;
  padding: 10px;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all .3s;
}

.forgot-btn:hover {
  background: rgba(251,191,36,.1);
}

.recovery-option-btn {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 20px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 16px;
  cursor: pointer;
  transition: all .3s;
  text-align: left;
  margin-bottom: 12px;
}

.recovery-option-btn:hover {
  background: rgba(255,255,255,.08);
  border-color: rgba(255,255,255,.2);
  transform: translateY(-2px);
}

.recovery-option-btn.danger {
  border-color: rgba(239,68,68,.3);
}

.recovery-option-btn.danger:hover {
  background: rgba(239,68,68,.1);
  border-color: rgba(239,68,68,.5);
}

.recovery-icon {
  font-size: 2.5rem;
  flex-shrink: 0;
}

.recovery-text {
  flex: 1;
}

.recovery-text strong {
  display: block;
  font-size: 1.1rem;
  color: #fff;
  margin-bottom: 5px;
}

.recovery-text span {
  display: block;
  font-size: .85rem;
  color: rgba(255,255,255,.6);
}

.recovery-key-display {
  background: rgba(251,191,36,.1);
  border: 2px solid rgba(251,191,36,.3);
  border-radius: 16px;
  padding: 24px;
  margin: 20px 0;
  font-family: 'Courier New', monospace;
  font-size: 1rem;
  font-weight: 600;
  color: #fbbf24;
  line-height: 1.8;
  word-break: break-word;
  user-select: all;
}

@media (max-width: 768px) {
  .container {
    margin: 80px auto 60px auto;
  }
  
  .summary {
    grid-template-columns: 1fr;
  }
  
  .passcode-digit {
    width: 45px;
    height: 55px;
    font-size: 1.6rem;
  }
  
  .modal-content {
    padding: 30px 20px;
  }
}
</style>
</head>
<body>
<div class="app-header">
  <div class="app-logo">💰</div>
  <h1 class="app-title">Expense Tracker</h1>
</div>

<!-- LOCK SCREEN -->
<div id="lock-screen">
  <div class="lock-container">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Enter Passcode</div>
    
    <div class="passcode-inputs" id="passcodeInputs">
      <input type="password" id="passcode-1" class="passcode-digit" maxlength="1" inputmode="numeric">
      <input type="password" id="passcode-2" class="passcode-digit" maxlength="1" inputmode="numeric">
      <input type="password" id="passcode-3" class="passcode-digit" maxlength="1" inputmode="numeric">
      <input type="password" id="passcode-4" class="passcode-digit" maxlength="1" inputmode="numeric">
      <input type="password" id="passcode-5" class="passcode-digit" maxlength="1" inputmode="numeric">
      <input type="password" id="passcode-6" class="passcode-digit" maxlength="1" inputmode="numeric">
    </div>
    
    <div id="lock-error" class="error-message"></div>
    
    <div class="lock-buttons">
      <button class="unlock-btn" onclick="attemptUnlock()">🔓 Unlock</button>
      <button class="forgot-btn" onclick="showForgotPasswordModal()">🔑 Forgot Passcode?</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-content" style="display: none;">
  <div class="container">
    <div class="sync-bar">
      <button class="sync-btn settings" onclick="showSettings()">⚙️ Settings</button>
      <button class="sync-btn danger" onclick="lockApp()">🔒 Lock App</button>
    </div>

    <div class="pane">
      <div class="pane-header">
        <div class="pane-title">Add Expense</div>
      </div>
      
      <div class="summary">
        <div class="summary-item full-width">
          <div class="summary-label">Total Expenses</div>
          <div class="summary-value" id="total-display">$0.00</div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Category</label>
        <input type="text" id="category-input" placeholder="e.g., Groceries, Rent">
      </div>

      <div class="input-group">
        <label class="input-label">Amount</label>
        <input type="number" id="amount-input" placeholder="0.00" step="0.01">
      </div>

      <button class="btn" onclick="addExpense()">➕ Add Expense</button>

      <div class="expenses-list" id="expenses-list">
        <div class="empty-state">
          <div class="empty-state-icon">📊</div>
          <div>No expenses yet</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div id="forgot-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">🔐 Recover Access</div>
      <button class="close-btn" onclick="closeForgotModal()">✕</button>
    </div>

    <!-- Recovery Method Selection -->
    <div id="recovery-methods">
      <button class="recovery-option-btn" onclick="showSecurityQuestions()">
        <div class="recovery-icon">❓</div>
        <div class="recovery-text">
          <strong>Answer Security Questions</strong>
          <span>Answer your security questions to reset passcode</span>
        </div>
      </button>

      <button class="recovery-option-btn" onclick="showRecoveryKey()">
        <div class="recovery-icon">🔑</div>
        <div class="recovery-text">
          <strong>Enter Recovery Key</strong>
          <span>Use your 12-word recovery key to unlock</span>
        </div>
      </button>

      <button class="recovery-option-btn danger" onclick="confirmResetApp()">
        <div class="recovery-icon">⚠️</div>
        <div class="recovery-text">
          <strong>Reset App</strong>
          <span>Delete all data and start fresh (cannot undo)</span>
        </div>
      </button>
    </div>

    <!-- Security Questions Form -->
    <div id="security-questions" style="display: none;">
      <div id="recovery-error" class="error-message"></div>
      
      <div class="input-group">
        <label class="input-label" id="q1-label">Question 1?</label>
        <input type="text" id="answer-1" placeholder="Your answer">
      </div>

      <div class="input-group">
        <label class="input-label" id="q2-label">Question 2?</label>
        <input type="text" id="answer-2" placeholder="Your answer">
      </div>

      <div class="input-group">
        <label class="input-label">New Passcode (6 digits)</label>
        <input type="password" id="new-passcode-q" placeholder="123456" maxlength="6">
      </div>

      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="backToMethods()">Back</button>
        <button class="modal-btn save" onclick="verifySecurityQuestions()">Verify & Reset</button>
      </div>
    </div>

    <!-- Recovery Key Form -->
    <div id="recovery-key" style="display: none;">
      <div id="recovery-error" class="error-message"></div>
      
      <div class="input-group">
        <label class="input-label">Enter Your 12-Word Recovery Key</label>
        <textarea id="key-input" style="width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: rgba(255,255,255,.06); color: #fff; font-family: monospace; resize: vertical; min-height: 100px;"></textarea>
      </div>

      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="backToMethods()">Back</button>
        <button class="modal-btn save" onclick="verifyRecoveryKey()">Unlock</button>
      </div>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">⚙️ Settings</div>
      <button class="close-btn" onclick="closeSettings()">✕</button>
    </div>

    <button class="sync-btn settings" onclick="showChangePasscodeModal()" style="width: 100%; margin-bottom: 15px;">
      🔐 Change Passcode
    </button>

    <div id="settings-info" style="background: rgba(139,92,246,.1); border: 1px solid rgba(139,92,246,.3); border-radius: 12px; padding: 16px; margin-bottom: 20px;">
      <div style="font-size: .85rem; font-weight: 700; color: rgba(255,255,255,.9); margin-bottom: 8px; text-transform: uppercase;">Recovery Key Status</div>
      <div style="font-size: 1.1rem; font-weight: 600; color: #8b5cf6;">✅ Saved</div>
    </div>

    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeSettings()">Close</button>
    </div>
  </div>
</div>

<!-- CHANGE PASSCODE MODAL -->
<div id="change-passcode-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">🔐 Change Passcode</div>
      <button class="close-btn" onclick="closeChangePasscodeModal()">✕</button>
    </div>

    <div id="passcode-error" class="error-message"></div>

    <div class="input-group">
      <label class="input-label">Current Passcode</label>
      <input type="password" id="current-passcode" placeholder="Enter current 6-digit code" maxlength="6">
    </div>

    <div class="input-group">
      <label class="input-label">New Passcode</label>
      <input type="password" id="new-passcode" placeholder="Enter new 6-digit code" maxlength="6">
    </div>

    <div class="input-group">
      <label class="input-label">Confirm New Passcode</label>
      <input type="password" id="confirm-passcode" placeholder="Confirm new 6-digit code" maxlength="6">
    </div>

    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeChangePasscodeModal()">Cancel</button>
      <button class="modal-btn save" onclick="updatePasscode()">Change Passcode</button>
    </div>
  </div>
</div>

<script>
// ==================== DATA MANAGEMENT ====================
let authSettings = {
  passcodeHash: null,
  recoveryKey: null,
  securityQuestions: [],
  securityAnswersHash: [],
  setupComplete: false
};

let expenses = [];

function loadData() {
  try {
    const saved = localStorage.getItem('authSettings');
    if (saved) authSettings = JSON.parse(saved);
    
    const savedExpenses = localStorage.getItem('expenses');
    if (savedExpenses) expenses = JSON.parse(savedExpenses);
  } catch (e) {
    console.error('Error loading data:', e);
  }
}

function saveData() {
  localStorage.setItem('authSettings', JSON.stringify(authSettings));
  localStorage.setItem('expenses', JSON.stringify(expenses));
}

// ==================== HASH FUNCTION ====================
function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return Math.abs(hash).toString();
}

// ==================== RECOVERY KEY GENERATION ====================
function generateRecoveryKey() {
  const words = ['apple', 'beach', 'cloud', 'dream', 'eagle', 'forest', 'garden', 'horizon',
    'island', 'jungle', 'kingdom', 'lemon', 'mountain', 'ocean', 'planet', 'quantum',
    'river', 'stellar', 'treasure', 'universe', 'valley', 'wonder', 'yellow', 'zenith'];
  
  let key = [];
  for (let i = 0; i < 12; i++) {
    key.push(words[Math.floor(Math.random() * words.length)]);
  }
  return key.join('-');
}

// ==================== SETUP ====================
function initializeApp() {
  loadData();
  
  if (!authSettings.setupComplete) {
    setupApp();
  } else {
    showLockScreen();
  }
}

function setupApp() {
  const passcode = prompt('🔐 Create a 6-digit passcode:');
  if (!passcode || passcode.length !== 6 || !/^\d+$/.test(passcode)) {
    alert('❌ Passcode must be exactly 6 digits');
    return setupApp();
  }

  const q1 = prompt('❓ Security Question 1: What is your favorite color?');
  const a1 = prompt('Answer:');
  
  if (!q1 || !a1) {
    alert('❌ All fields required');
    return setupApp();
  }

  const q2 = prompt('❓ Security Question 2: What is your pet\'s name?');
  const a2 = prompt('Answer:');
  
  if (!q2 || !a2) {
    alert('❌ All fields required');
    return setupApp();
  }

  authSettings.passcodeHash = hashCode(passcode);
  authSettings.securityQuestions = [q1, q2];
  authSettings.securityAnswersHash = [hashCode(a1.toLowerCase()), hashCode(a2.toLowerCase())];
  authSettings.recoveryKey = generateRecoveryKey();
  authSettings.setupComplete = true;

  saveData();

  alert('✅ Setup Complete!\n\nSAVE THIS RECOVERY KEY:\n\n' + authSettings.recoveryKey + '\n\nYou\'ll need it if you forget your passcode.');

  showLockScreen();
}

// ==================== PASSCODE INPUT ====================
document.addEventListener('DOMContentLoaded', () => {
  for (let i = 1; i <= 6; i++) {
    const input = document.getElementById(`passcode-${i}`);
    if (!input) continue;

    input.addEventListener('input', (e) => {
      const val = e.target.value;
      if (!/^\d*$/.test(val)) {
        e.target.value = '';
        return;
      }
      
      if (val && i < 6) {
        document.getElementById(`passcode-${i + 1}`).focus();
      }
      
      if (val) {
        e.target.classList.add('filled');
      } else {
        e.target.classList.remove('filled');
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && i > 1) {
        document.getElementById(`passcode-${i - 1}`).focus();
      }
      if (e.key === 'Enter') {
        attemptUnlock();
      }
    });
  }

  initializeApp();
});

// ==================== UNLOCK ====================
function attemptUnlock() {
  let code = '';
  for (let i = 1; i <= 6; i++) {
    code += document.getElementById(`passcode-${i}`).value;
  }

  const errorEl = document.getElementById('lock-error');

  if (code.length !== 6) {
    errorEl.textContent = '❌ Enter all 6 digits';
    errorEl.classList.add('show');
    return;
  }

  if (hashCode(code) === authSettings.passcodeHash) {
    errorEl.classList.remove('show');
    showApp();
  } else {
    errorEl.textContent = '❌ Incorrect passcode';
    errorEl.classList.add('show');
    document.getElementById('passcodeInputs').classList.add('shake-error');
    setTimeout(() => {
      document.getElementById('passcodeInputs').classList.remove('shake-error');
    }, 500);
  }
}

// ==================== LOCK/UNLOCK UI ====================
function showLockScreen() {
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('app-content').style.display = 'none';
  
  // Clear inputs
  for (let i = 1; i <= 6; i++) {
    document.getElementById(`passcode-${i}`).value = '';
    document.getElementById(`passcode-${i}`).classList.remove('filled');
  }
  document.getElementById('lock-error').classList.remove('show');
}

function showApp() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app-content').style.display = 'block';
  updateExpenseDisplay();
}

function lockApp() {
  showLockScreen();
}

// ==================== FORGOT PASSWORD ====================
function showForgotPasswordModal() {
  document.getElementById('forgot-modal').classList.add('active');
}

function closeForgotModal() {
  document.getElementById('forgot-modal').classList.remove('active');
  document.getElementById('recovery-methods').style.display = 'block';
  document.getElementById('security-questions').style.display = 'none';
  document.getElementById('recovery-key').style.display = 'none';
}

function backToMethods() {
  document.getElementById('recovery-methods').style.display = 'block';
  document.getElementById('security-questions').style.display = 'none';
  document.getElementById('recovery-key').style.display = 'none';
  document.getElementById('recovery-error').classList.remove('show');
}

function showSecurityQuestions() {
  document.getElementById('recovery-methods').style.display = 'none';
  document.getElementById('security-questions').style.display = 'block';
  document.getElementById('q1-label').textContent = authSettings.securityQuestions[0];
  document.getElementById('q2-label').textContent = authSettings.securityQuestions[1];
}

function showRecoveryKey() {
  document.getElementById('recovery-methods').style.display = 'none';
  document.getElementById('recovery-key').style.display = 'block';
}

function verifySecurityQuestions() {
  const a1 = document.getElementById('answer-1').value.toLowerCase();
  const a2 = document.getElementById('answer-2').value.toLowerCase();
  const newCode = document.getElementById('new-passcode-q').value;
  const errorEl = document.getElementById('recovery-error');

  if (!a1 || !a2 || !newCode) {
    errorEl.textContent = '❌ Please fill all fields';
    errorEl.classList.add('show');
    return;
  }

  if (newCode.length !== 6 || !/^\d+$/.test(newCode)) {
    errorEl.textContent = '❌ Passcode must be 6 digits';
    errorEl.classList.add('show');
    return;
  }

  if (hashCode(a1) !== authSettings.securityAnswersHash[0] ||
      hashCode(a2) !== authSettings.securityAnswersHash[1]) {
    errorEl.textContent = '❌ Incorrect answers';
    errorEl.classList.add('show');
    return;
  }

  authSettings.passcodeHash = hashCode(newCode);
  saveData();
  
  alert('✅ Passcode reset! Use your new code to unlock.');
  closeForgotModal();
  showLockScreen();
}

function verifyRecoveryKey() {
  const key = document.getElementById('key-input').value.trim().replace(/-/g, ' ').toLowerCase();
  const expectedKey = authSettings.recoveryKey.replace(/-/g, ' ').toLowerCase();
  const errorEl = document.getElementById('recovery-error');

  if (key !== expectedKey) {
    errorEl.textContent = '❌ Invalid recovery key';
    errorEl.classList.add('show');
    return;
  }

  closeForgotModal();
  showApp();
  alert('✅ You\'re now unlocked!');
}

function confirmResetApp() {
  if (confirm('⚠️ Delete ALL data and reset app?')) {
    if (confirm('Are you SURE? This cannot be undone!')) {
      localStorage.clear();
      location.reload();
    }
  }
}

// ==================== SETTINGS ====================
function showSettings() {
  document.getElementById('settings-modal').classList.add('active');
}

function closeSettings() {
  document.getElementById('settings-modal').classList.remove('active');
}

// ==================== CHANGE PASSCODE ====================
function showChangePasscodeModal() {
  document.getElementById('change-passcode-modal').classList.add('active');
  document.getElementById('current-passcode').value = '';
  document.getElementById('new-passcode').value = '';
  document.getElementById('confirm-passcode').value = '';
  document.getElementById('passcode-error').classList.remove('show');
}

function closeChangePasscodeModal() {
  document.getElementById('change-passcode-modal').classList.remove('active');
}

function updatePasscode() {
  const currentCode = document.getElementById('current-passcode').value.trim();
  const newCode = document.getElementById('new-passcode').value.trim();
  const confirmCode = document.getElementById('confirm-passcode').value.trim();
  const errorEl = document.getElementById('passcode-error');

  if (!currentCode || !newCode || !confirmCode) {
    errorEl.textContent = '❌ Please fill all fields';
    errorEl.classList.add('show');
    return;
  }

  if (currentCode.length !== 6 || newCode.length !== 6 || confirmCode.length !== 6) {
    errorEl.textContent = '❌ Passcodes must be 6 digits';
    errorEl.classList.add('show');
    return;
  }

  if (!/^\d+$/.test(currentCode) || !/^\d+$/.test(newCode) || !/^\d+$/.test(confirmCode)) {
    errorEl.textContent = '❌ Passcodes can only contain digits';
    errorEl.classList.add('show');
    return;
  }

  if (hashCode(currentCode) !== authSettings.passcodeHash) {
    errorEl.textContent = '❌ Current passcode is incorrect';
    errorEl.classList.add('show');
    return;
  }

  if (newCode !== confirmCode) {
    errorEl.textContent = '❌ New passcodes do not match';
    errorEl.classList.add('show');
    return;
  }

  if (newCode === currentCode) {
    errorEl.textContent = '❌ New passcode must be different';
    errorEl.classList.add('show');
    return;
  }

  authSettings.passcodeHash = hashCode(newCode);
  saveData();

  alert('✅ Passcode changed successfully!');
  closeChangePasscodeModal();
  closeSettings();
}

// ==================== EXPENSES ====================
function addExpense() {
  const category = document.getElementById('category-input').value.trim();
  const amount = parseFloat(document.getElementById('amount-input').value);

  if (!category || !amount || isNaN(amount)) {
    alert('❌ Please fill all fields');
    return;
  }

  expenses.push({
    category,
    amount,
    date: new Date().toLocaleDateString()
  });

  saveData();
  updateExpenseDisplay();

  document.getElementById('category-input').value = '';
  document.getElementById('amount-input').value = '';
}

function updateExpenseDisplay() {
  const list = document.getElementById('expenses-list');
  const total = expenses.reduce((sum, exp) => sum + exp.amount, 0);
  
  document.getElementById('total-display').textContent = '$' + total.toFixed(2);

  if (expenses.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div>No expenses yet</div></div>';
  } else {
    list.innerHTML = expenses.map((exp, idx) => `
      <div class="expense-item">
        <div class="expense-info">
          <div class="expense-desc">${exp.category}</div>
          <div class="expense-cat">${exp.date}</div>
        </div>
        <div class="expense-amount">$${exp.amount.toFixed(2)}</div>
        <button onclick="deleteExpense(${idx})" style="background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; margin-left: 10px;">Delete</button>
      </div>
    `).join('');
  }
}

function deleteExpense(idx) {
  if (confirm('Delete this expense?')) {
    expenses.splice(idx, 1);
    saveData();
    updateExpenseDisplay();
  }
}
</script>
