<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      max-width: 1400px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .pane {
      background: linear-gradient(135deg, rgba(30, 30, 30, 0.9) 0%, rgba(20, 20, 20, 0.95) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .pane::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    }

    .pane-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .pane-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .period-nav {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .period-nav button {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .period-nav button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.9);
    }

    .period-nav button.active {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .period-dates {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 24px;
      font-weight: 400;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .summary-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s;
    }

    .summary-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .summary-label {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 500;
    }

    .summary-value {
      font-size: 1.9rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
    }

    .summary-value.positive {
      color: #10b981;
    }

    .summary-value.negative {
      color: #ef4444;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
      display: block;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 16px;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    input:focus, select:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.02);
    }

    select option {
      background: #1a1a1a;
      color: #fff;
    }

    .btn {
      width: 100%;
      background: #fff;
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(255, 255, 255, 0.1);
    }

    .btn:active {
      transform: translateY(0);
    }

    .expenses-list {
      max-height: 400px;
      overflow-y: auto;
      margin-top: 24px;
      padding-right: 4px;
    }

    .expense-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .expense-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }

    .expense-info {
      flex: 1;
    }

    .expense-desc {
      font-size: 1rem;
      font-weight: 500;
      color: #fff;
      margin-bottom: 4px;
    }

    .expense-cat {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .expense-amount {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      margin-right: 12px;
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      font-weight: 500;
    }

    .delete-btn:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.3);
    }

    .empty-state-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    /* Scrollbar styling */
    .expenses-list::-webkit-scrollbar {
      width: 6px;
    }

    .expenses-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 3px;
    }

    .expenses-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    .expenses-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 20px 10px;
      }

      .pane {
        padding: 24px;
      }

      .pane-title {
        font-size: 1.2rem;
      }

      .summary-value {
        font-size: 1.5rem;
      }

      .period-nav button {
        padding: 6px 12px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left Pane: Period 1 -->
    <div class="pane" id="pane-1">
      <div class="pane-header">
        <div class="pane-title">Period 1</div>
        <div class="period-nav">
          <button onclick="changePeriod(0, 1)" class="active">Current</button>
          <button onclick="changePeriod(1, 1)">Next</button>
        </div>
      </div>

      <div class="period-dates" id="period-1-dates">Loading...</div>

      <div class="summary">
        <div class="summary-item">
          <div class="summary-label">Salary</div>
          <div class="summary-value" id="salary-1">$0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Expenses</div>
          <div class="summary-value" id="expenses-1">$0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Savings</div>
          <div class="summary-value" id="savings-1">$0</div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Salary</label>
        <input type="number" id="salary-input-1" placeholder="Enter salary" step="0.01">
      </div>

      <div class="input-group">
        <label class="input-label">Category</label>
        <input type="text" id="category-1" placeholder="e.g., Groceries, Rent">
      </div>

      <div class="input-group">
        <label class="input-label">Amount</label>
        <input type="number" id="amount-1" placeholder="0.00" step="0.01">
      </div>

      <button class="btn" onclick="addExpense(1)">Add Expense</button>

      <div class="expenses-list" id="expenses-list-1">
        <div class="empty-state">
          <div class="empty-state-icon">📊</div>
          <div>No expenses yet</div>
        </div>
      </div>
    </div>

    <!-- Right Pane: Period 2 -->
    <div class="pane" id="pane-2">
      <div class="pane-header">
        <div class="pane-title">Period 2</div>
        <div class="period-nav">
          <button onclick="changePeriod(0, 2)">Current</button>
          <button onclick="changePeriod(1, 2)" class="active">Next</button>
        </div>
      </div>

      <div class="period-dates" id="period-2-dates">Loading...</div>

      <div class="summary">
        <div class="summary-item">
          <div class="summary-label">Salary</div>
          <div class="summary-value" id="salary-2">$0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Expenses</div>
          <div class="summary-value" id="expenses-2">$0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Savings</div>
          <div class="summary-value" id="savings-2">$0</div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Salary</label>
        <input type="number" id="salary-input-2" placeholder="Enter salary" step="0.01">
      </div>

      <div class="input-group">
        <label class="input-label">Category</label>
        <input type="text" id="category-2" placeholder="e.g., Groceries, Rent">
      </div>

      <div class="input-group">
        <label class="input-label">Amount</label>
        <input type="number" id="amount-2" placeholder="0.00" step="0.01">
      </div>

      <button class="btn" onclick="addExpense(2)">Add Expense</button>

      <div class="expenses-list" id="expenses-list-2">
        <div class="empty-state">
          <div class="empty-state-icon">📊</div>
          <div>No expenses yet</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let salaries = JSON.parse(localStorage.getItem('salaries')) || {};
    let settings = JSON.parse(localStorage.getItem('paySettings')) || {
      startDate: '2026-01-07'
    };

    let pane1Offset = 0;
    let pane2Offset = 1;

    function getPeriod(offset = 0) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      const startDate = new Date(settings.startDate + 'T00:00:00');
      const millisDiff = today.getTime() - startDate.getTime();
      const daysDiff = Math.floor(millisDiff / (1000 * 60 * 60 * 24));
      const currentPeriodNum = Math.floor(daysDiff / 14);
      const targetPeriod = currentPeriodNum + offset;
      
      const periodStart = new Date(startDate);
      periodStart.setDate(periodStart.getDate() + (targetPeriod * 14));
      
      const periodEnd = new Date(periodStart);
      periodEnd.setDate(periodEnd.getDate() + 13);
      periodEnd.setHours(23, 59, 59, 999);
      
      return {
        start: periodStart,
        end: periodEnd,
        key: `period-${periodStart.getFullYear()}-${String(periodStart.getMonth() + 1).padStart(2, '0')}-${String(periodStart.getDate()).padStart(2, '0')}`
      };
    }

    function formatDate(date) {
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function changePeriod(offset, paneNum) {
      if (paneNum === 1) {
        pane1Offset = offset;
        // Update active state for pane 1 buttons
        const buttons = document.querySelectorAll('#pane-1 .period-nav button');
        buttons.forEach((btn, idx) => {
          btn.classList.toggle('active', idx === offset);
        });
      } else {
        pane2Offset = offset;
        // Update active state for pane 2 buttons
        const buttons = document.querySelectorAll('#pane-2 .period-nav button');
        buttons.forEach((btn, idx) => {
          btn.classList.toggle('active', idx === offset);
        });
      }
      updateDisplay();
    }

    function updateDisplay() {
      updatePane(1, pane1Offset);
      updatePane(2, pane2Offset);
    }

    function updatePane(paneNum, offset) {
      const period = getPeriod(offset);
      
      // Update dates
      document.getElementById(`period-${paneNum}-dates`).textContent = 
        `${formatDate(period.start)} - ${formatDate(period.end)}`;
      
      // Get salary
      const salary = salaries[period.key] || 0;
      document.getElementById(`salary-input-${paneNum}`).value = salary || '';
      
      // Get expenses for this period
      const periodExpenses = transactions.filter(t => {
        const tDate = new Date(t.date);
        tDate.setHours(0, 0, 0, 0);
        return tDate >= period.start && tDate <= period.end;
      });
      
      const totalExpenses = periodExpenses.reduce((sum, t) => sum + t.amount, 0);
      const savings = salary - totalExpenses;
      
      // Update summary
      document.getElementById(`salary-${paneNum}`).textContent = `$${salary.toFixed(0)}`;
      document.getElementById(`expenses-${paneNum}`).textContent = `$${totalExpenses.toFixed(0)}`;
      
      const savingsEl = document.getElementById(`savings-${paneNum}`);
      savingsEl.textContent = `$${savings.toFixed(0)}`;
      savingsEl.className = 'summary-value ' + (savings >= 0 ? 'positive' : 'negative');
      
      // Render expenses list
      renderExpenses(paneNum, periodExpenses);
    }

    function renderExpenses(paneNum, expenses) {
      const listEl = document.getElementById(`expenses-list-${paneNum}`);
      
      if (expenses.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📊</div>
            <div>No expenses yet</div>
          </div>
        `;
        return;
      }
      
      listEl.innerHTML = expenses.reverse().map(exp => {
        const actualIndex = transactions.indexOf(exp);
        return `
          <div class="expense-item">
            <div class="expense-info">
              <div class="expense-desc">${exp.category}</div>
              <div class="expense-cat">${new Date(exp.date).toLocaleDateString()}</div>
            </div>
            <div class="expense-amount">$${exp.amount.toFixed(2)}</div>
            <button class="delete-btn" onclick="deleteExpense(${actualIndex})">✕</button>
          </div>
        `;
      }).join('');
    }

    function addExpense(paneNum) {
      const offset = paneNum === 1 ? pane1Offset : pane2Offset;
      const period = getPeriod(offset);
      
      const category = document.getElementById(`category-${paneNum}`).value.trim();
      const amount = parseFloat(document.getElementById(`amount-${paneNum}`).value);
      
      if (!category || !amount || amount <= 0) {
        alert('Please enter both category and amount');
        return;
      }
      
      const transaction = {
        id: Date.now(),
        category,
        amount,
        date: period.start.toISOString()
      };
      
      transactions.push(transaction);
      localStorage.setItem('transactions', JSON.stringify(transactions));
      
      // Clear inputs
      document.getElementById(`category-${paneNum}`).value = '';
      document.getElementById(`amount-${paneNum}`).value = '';
      
      updateDisplay();
    }

    function deleteExpense(index) {
      if (confirm('Delete this expense?')) {
        transactions.splice(index, 1);
        localStorage.setItem('transactions', JSON.stringify(transactions));
        updateDisplay();
      }
    }

    // Save salary when input changes
    document.getElementById('salary-input-1').addEventListener('change', function() {
      const period = getPeriod(pane1Offset);
      salaries[period.key] = parseFloat(this.value) || 0;
      localStorage.setItem('salaries', JSON.stringify(salaries));
      updateDisplay();
    });

    document.getElementById('salary-input-2').addEventListener('change', function() {
      const period = getPeriod(pane2Offset);
      salaries[period.key] = parseFloat(this.value) || 0;
      localStorage.setItem('salaries', JSON.stringify(salaries));
      updateDisplay();
    });

    // Enter key to add expense
    document.getElementById('amount-1').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addExpense(1);
    });

    document.getElementById('amount-2').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addExpense(2);
    });

    // Initialize
    updateDisplay();
  </script>
</body>
</html>
