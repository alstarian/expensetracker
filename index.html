<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Secure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== LOCK SCREEN ===== */
        .lock-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            background: rgba(30, 30, 46, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }

        .lock-icon {
            font-size: 60px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .lock-title {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
        }

        /* ===== PASSCODE INPUT ===== */
        .passcode-inputs {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .passcode-input {
            width: 50px;
            height: 50px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #444;
            border-radius: 12px;
            background: rgba(50, 50, 70, 0.8);
            color: #fff;
            transition: all 0.2s;
        }

        .passcode-input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(50, 50, 70, 1);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .passcode-input.filled {
            border-color: #00d4ff;
        }

        /* ===== BUTTONS ===== */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-unlock {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
        }

        .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
        }

        .btn-unlock:active {
            transform: translateY(0);
        }

        .btn-forgot {
            background: transparent;
            color: #00d4ff;
            border: 2px solid #00d4ff;
        }

        .btn-forgot:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        .btn-secondary {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border: 1px solid #00d4ff;
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        /* ===== MODALS ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content {
            background: rgba(30, 30, 46, 0.95);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
        }

        .form-input {
            padding: 12px;
            border: 2px solid #444;
            border-radius: 8px;
            background: rgba(50, 50, 70, 0.8);
            color: #fff;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(50, 50, 70, 1);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
            padding: 12px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 8px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .success-message {
            color: #51cf66;
            font-size: 14px;
            text-align: center;
            padding: 12px;
            background: rgba(81, 207, 102, 0.1);
            border-radius: 8px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        /* ===== SETUP SCREEN ===== */
        .setup-screen {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .setup-screen.active {
            display: flex;
        }

        .recovery-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .recovery-btn {
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            color: #00d4ff;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-size: 14px;
        }

        .recovery-btn:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        /* ===== APP SCREEN ===== */
        .app-screen {
            display: none;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .app-screen.active {
            display: flex;
        }

        .app-header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #00d4ff;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: rgba(30, 30, 46, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #00d4ff;
            backdrop-filter: blur(10px);
        }

        .input-section {
            display: flex;
            gap: 10px;
        }

        .input-section input {
            flex: 1;
        }

        .input-section button {
            min-width: 100px;
        }

        .expense-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .expense-item {
            background: rgba(50, 50, 70, 0.6);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #00d4ff;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .stat {
            background: rgba(0, 212, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #00d4ff;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #00d4ff;
        }

        .stat-label {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOCK SCREEN -->
        <div id="lockScreen" class="lock-screen">
            <div class="lock-icon">🔒</div>
            <div class="lock-title">Enter Passcode</div>

            <div class="passcode-inputs" id="passcodeInputs">
                <input type="text" id="unlock-1" class="passcode-input" maxlength="1" inputmode="numeric" placeholder="•">
                <input type="text" id="unlock-2" class="passcode-input" maxlength="1" inputmode="numeric" placeholder="•">
                <input type="text" id="unlock-3" class="passcode-input" maxlength="1" inputmode="numeric" placeholder="•">
                <input type="text" id="unlock-4" class="passcode-input" maxlength="1" inputmode="numeric" placeholder="•">
                <input type="text" id="unlock-5" class="passcode-input" maxlength="1" inputmode="numeric" placeholder="•">
                <input type="text" id="unlock-6" class="passcode-input" maxlength="1" inputmode="numeric" placeholder="•">
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="button-group">
                <button class="btn btn-unlock" id="unlockBtn">Unlock</button>
                <button class="btn btn-forgot" id="forgotBtn">🔑 Forgot Passcode?</button>
            </div>
        </div>

        <!-- RECOVERY MODAL -->
        <div id="recoveryModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">🔐 Recovery Options</div>
                <div class="modal-body">
                    <div class="error-message" id="recoveryError"></div>

                    <!-- SECURITY QUESTIONS -->
                    <div id="securityQuestionsForm" style="display: none;">
                        <div class="modal-header">Answer Security Questions</div>
                        <div class="form-group">
                            <label class="form-label" id="question1Label">Question 1?</label>
                            <input type="text" id="securityAnswer1" class="form-input" placeholder="Your answer">
                        </div>
                        <div class="form-group">
                            <label class="form-label" id="question2Label">Question 2?</label>
                            <input type="text" id="securityAnswer2" class="form-input" placeholder="Your answer">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Create New Passcode</label>
                            <input type="text" id="newPasscodeQ" class="form-input" placeholder="6 digits" maxlength="6" inputmode="numeric">
                        </div>
                        <button class="btn btn-unlock" id="verifyQuestionsBtn" style="margin-top: 10px;">Verify & Reset</button>
                    </div>

                    <!-- RECOVERY KEY -->
                    <div id="recoveryKeyForm" style="display: none;">
                        <div class="modal-header">Enter Recovery Key</div>
                        <div class="form-group">
                            <label class="form-label">12-Word Recovery Key</label>
                            <textarea id="recoveryKeyInput" class="form-input" rows="4" placeholder="Enter all 12 words separated by spaces or hyphens"></textarea>
                        </div>
                        <button class="btn btn-unlock" id="verifyKeyBtn" style="margin-top: 10px;">Unlock App</button>
                    </div>

                    <!-- METHOD SELECTION (Default) -->
                    <div id="recoveryMethodSelection">
                        <button class="recovery-btn" id="useSecurityQuestionsBtn">
                            ❓ Answer Security Questions
                        </button>
                        <button class="recovery-btn" id="useRecoveryKeyBtn">
                            🔑 Enter Recovery Key
                        </button>
                        <button class="recovery-btn" id="resetAppBtn" style="border-color: #ff6b6b; color: #ff6b6b;">
                            ⚠️ Reset App (Delete All Data)
                        </button>
                    </div>

                    <button class="btn btn-secondary" id="closeRecoveryBtn" style="margin-top: 20px;">Cancel</button>
                </div>
            </div>
        </div>

        <!-- APP SCREEN -->
        <div id="appScreen" class="app-screen">
            <div class="app-header">
                <h1>💰 Expense Tracker</h1>
                <button class="btn btn-secondary" id="logoutBtn" style="width: auto; margin-top: 10px;">🔒 Lock App</button>
            </div>

            <div class="main-content">
                <div class="card">
                    <h3>Add Expense</h3>
                    <div class="input-section">
                        <input type="text" id="categoryInput" class="form-input" placeholder="Category" style="flex: 0.5;">
                        <input type="number" id="amountInput" class="form-input" placeholder="Amount" style="flex: 0.5;">
                        <button class="btn btn-unlock" id="addExpenseBtn">Add</button>
                    </div>
                </div>

                <div class="card">
                    <h3>Expenses</h3>
                    <div class="expense-list" id="expenseList">
                        <p style="color: #aaa; text-align: center;">No expenses yet</p>
                    </div>
                </div>

                <div class="card">
                    <h3>Statistics</h3>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value" id="totalExpenses">$0</div>
                            <div class="stat-label">Total Expenses</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="expenseCount">0</div>
                            <div class="stat-label">Expenses</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== DATA STRUCTURE =====
        let appData = {
            passcodeHash: null,
            recoveryKey: null,
            securityQuestions: [],
            securityAnswersHash: [],
            expenses: [],
            isLocked: true,
            setupComplete: false
        };

        // ===== UTILITY FUNCTIONS =====
        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32-bit integer
            }
            return Math.abs(hash).toString();
        }

        function generateRecoveryKey() {
            const words = ['apple', 'beach', 'cloud', 'dream', 'eagle', 'forest', 'garden', 'horizon', 
                          'island', 'jungle', 'kingdom', 'lemon', 'mountain', 'ocean', 'planet', 'quantum',
                          'river', 'stellar', 'treasure', 'universe', 'valley', 'wonder', 'yellow', 'zenith',
                          'anchor', 'bridge', 'castle', 'diamond', 'echo', 'fountain'];

            let key = [];
            for (let i = 0; i < 12; i++) {
                key.push(words[Math.floor(Math.random() * words.length)]);
            }
            return key.join('-');
        }

        function saveData() {
            localStorage.setItem('expenseTrackerData', JSON.stringify(appData));
        }

        function loadData() {
            const saved = localStorage.getItem('expenseTrackerData');
            if (saved) {
                appData = JSON.parse(saved);
            }
        }

        // ===== SETUP FLOW =====
        function showSetup() {
            const passcode = prompt('Create a 6-digit passcode:');
            if (!passcode || passcode.length !== 6 || !/^\d+$/.test(passcode)) {
                alert('Passcode must be exactly 6 digits');
                return showSetup();
            }

            appData.passcodeHash = hashCode(passcode);

            // Security questions
            const q1 = prompt('Security Question 1: What is your favorite color?');
            const a1 = prompt('Your answer:');
            const q2 = prompt('Security Question 2: What is your pet\'s name?');
            const a2 = prompt('Your answer:');

            if (!q1 || !a1 || !q2 || !a2) {
                alert('All fields required');
                return showSetup();
            }

            appData.securityQuestions = [q1, q2];
            appData.securityAnswersHash = [hashCode(a1.toLowerCase()), hashCode(a2.toLowerCase())];

            // Recovery key
            appData.recoveryKey = generateRecoveryKey();
            alert('SAVE THIS KEY:
\n' + appData.recoveryKey + '\n\nYou\'ll need it if you forget your passcode.');

            appData.setupComplete = true;
            appData.isLocked = true;
            saveData();

            showLockScreen();
        }

        // ===== SCREEN MANAGEMENT =====
        function showLockScreen() {
            document.getElementById('lockScreen').style.display = 'flex';
            document.getElementById('appScreen').classList.remove('active');
            document.getElementById('recoveryModal').classList.remove('active');
            appData.isLocked = true;

            // Clear inputs
            for (let i = 1; i <= 6; i++) {
                document.getElementById(`unlock-${i}`).value = '';
            }
            document.getElementById('errorMessage').textContent = '';
            document.getElementById('errorMessage').classList.remove('show');
        }

        function showApp() {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('appScreen').classList.add('active');
            document.getElementById('recoveryModal').classList.remove('active');
            appData.isLocked = false;
            updateExpenseList();
        }

        // ===== PASSWORD VERIFICATION =====
        function attemptUnlock() {
            let code = '';
            for (let i = 1; i <= 6; i++) {
                code += document.getElementById(`unlock-${i}`).value;
            }

            if (code.length !== 6) {
                showError('Please enter all 6 digits');
                return;
            }

            if (hashCode(code) === appData.passcodeHash) {
                clearError();
                showApp();
            } else {
                showError('❌ Incorrect passcode');
                // Shake effect
                document.getElementById('passcodeInputs').style.animation = 'shake 0.3s';
                setTimeout(() => {
                    document.getElementById('passcodeInputs').style.animation = '';
                }, 300);
            }
        }

        // ===== ERROR HANDLING =====
        function showError(msg) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = msg;
            errorEl.classList.add('show');
        }

        function clearError() {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = '';
            errorEl.classList.remove('show');
        }

        // ===== RECOVERY =====
        function openRecoveryModal() {
            console.log('Opening recovery modal...'); // DEBUG
            document.getElementById('recoveryModal').classList.add('active');
            document.getElementById('recoveryMethodSelection').style.display = 'block';
            document.getElementById('securityQuestionsForm').style.display = 'none';
            document.getElementById('recoveryKeyForm').style.display = 'none';
        }

        function closeRecoveryModal() {
            document.getElementById('recoveryModal').classList.remove('active');
            document.getElementById('recoveryMethodSelection').style.display = 'block';
        }

        function showSecurityQuestionsForm() {
            document.getElementById('recoveryMethodSelection').style.display = 'none';
            document.getElementById('securityQuestionsForm').style.display = 'block';
            document.getElementById('question1Label').textContent = appData.securityQuestions[0];
            document.getElementById('question2Label').textContent = appData.securityQuestions[1];
        }

        function showRecoveryKeyForm() {
            document.getElementById('recoveryMethodSelection').style.display = 'none';
            document.getElementById('recoveryKeyForm').style.display = 'block';
        }

        function verifySecurityQuestions() {
            const a1 = document.getElementById('securityAnswer1').value.toLowerCase();
            const a2 = document.getElementById('securityAnswer2').value.toLowerCase();
            const newCode = document.getElementById('newPasscodeQ').value;

            if (!a1 || !a2 || newCode.length !== 6) {
                alert('Please fill all fields and enter a 6-digit passcode');
                return;
            }

            if (hashCode(a1) === appData.securityAnswersHash[0] && 
                hashCode(a2) === appData.securityAnswersHash[1]) {

                appData.passcodeHash = hashCode(newCode);
                saveData();
                alert('✅ Passcode reset! Use your new code to unlock.');
                closeRecoveryModal();
                showLockScreen();
            } else {
                alert('❌ Incorrect answers');
            }
        }

        function verifyRecoveryKey() {
            const key = document.getElementById('recoveryKeyInput').value.trim().replace(/[-]/g, ' ').toLowerCase();
            const expectedKey = appData.recoveryKey.replace(/[-]/g, ' ').toLowerCase();

            if (key === expectedKey) {
                appData.isLocked = false;
                closeRecoveryModal();
                showApp();
                alert('✅ You\'re now unlocked!');
            } else {
                alert('❌ Invalid recovery key');
            }
        }

        // ===== EXPENSES =====
        function addExpense() {
            const category = document.getElementById('categoryInput').value.trim();
            const amount = parseFloat(document.getElementById('amountInput').value);

            if (!category || !amount) {
                alert('Please fill all fields');
                return;
            }

            appData.expenses.push({
                category,
                amount,
                date: new Date().toLocaleDateString()
            });

            saveData();
            updateExpenseList();

            document.getElementById('categoryInput').value = '';
            document.getElementById('amountInput').value = '';
        }

        function updateExpenseList() {
            const list = document.getElementById('expenseList');

            if (appData.expenses.length === 0) {
                list.innerHTML = '<p style="color: #aaa; text-align: center;">No expenses yet</p>';
            } else {
                list.innerHTML = appData.expenses.map((exp, idx) => `
                    <div class="expense-item">
                        <div>
                            <strong>${exp.category}</strong><br>
                            <small style="color: #aaa;">${exp.date}</small>
                        </div>
                        <div>
                            <strong>$${exp.amount.toFixed(2)}</strong>
                            <button class="btn" style="width: 30px; padding: 5px; margin-left: 10px; background: #ff6b6b; font-size: 12px;" onclick="deleteExpense(${idx})">✕</button>
                        </div>
                    </div>
                `).join('');
            }

            // Update stats
            const total = appData.expenses.reduce((sum, exp) => sum + exp.amount, 0);
            document.getElementById('totalExpenses').textContent = '$' + total.toFixed(2);
            document.getElementById('expenseCount').textContent = appData.expenses.length;
        }

        function deleteExpense(index) {
            if (confirm('Delete this expense?')) {
                appData.expenses.splice(index, 1);
                saveData();
                updateExpenseList();
            }
        }

        // ===== EVENT LISTENERS =====
        document.addEventListener('DOMContentLoaded', () => {
            loadData();

            // Passcode input handling
            for (let i = 1; i <= 6; i++) {
                const input = document.getElementById(`unlock-${i}`);
                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    // Only accept digits
                    if (!/^\d*$/.test(val)) {
                        e.target.value = '';
                        return;
                    }
                    // Auto-focus to next field
                    if (val && i < 6) {
                        document.getElementById(`unlock-${i + 1}`).focus();
                    }
                });
                // Handle backspace
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && i > 1) {
                        document.getElementById(`unlock-${i - 1}`).focus();
                    }
                });
            }

            // Buttons
            document.getElementById('unlockBtn').addEventListener('click', attemptUnlock);
            document.getElementById('forgotBtn').addEventListener('click', openRecoveryModal);
            document.getElementById('logoutBtn').addEventListener('click', showLockScreen);
            document.getElementById('closeRecoveryBtn').addEventListener('click', closeRecoveryModal);

            document.getElementById('useSecurityQuestionsBtn').addEventListener('click', showSecurityQuestionsForm);
            document.getElementById('useRecoveryKeyBtn').addEventListener('click', showRecoveryKeyForm);
            document.getElementById('verifyQuestionsBtn').addEventListener('click', verifySecurityQuestions);
            document.getElementById('verifyKeyBtn').addEventListener('click', verifyRecoveryKey);

            document.getElementById('addExpenseBtn').addEventListener('click', addExpense);

            document.getElementById('resetAppBtn').addEventListener('click', () => {
                if (confirm('Delete ALL data and reset app?') && confirm('Are you SURE? This cannot be undone!')) {
                    localStorage.removeItem('expenseTrackerData');
                    location.reload();
                }
            });

            // Enter key for passcode
            document.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !appData.isLocked === false) {
                    attemptUnlock();
                }
            });

            // Check if setup needed
            if (!appData.setupComplete) {
                showSetup();
            } else {
                showLockScreen();
            }
        });
    </script>
</body>
</html>
