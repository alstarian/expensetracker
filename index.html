<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000000;
      background-image: 
        radial-gradient(at 0% 0%, rgba(30, 64, 175, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
      min-height: 100vh;
      padding: 60px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        linear-gradient(45deg, transparent 48%, rgba(255,255,255,0.01) 50%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, rgba(255,255,255,0.01) 50%, transparent 52%);
      background-size: 60px 60px;
      pointer-events: none;
      opacity: 0.3;
    }

    .container {
      max-width: 1600px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      position: relative;
      z-index: 1;
    }

    .sync-bar {
      grid-column: 1 / -1;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px 28px;
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .sync-bar::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      to {
        left: 200%;
      }
    }

    .sync-btn {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .sync-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .sync-btn:hover::before {
      opacity: 1;
    }

    .sync-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .sync-btn:active {
      transform: translateY(-1px);
    }

    .sync-btn.export {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(16, 185, 129, 0.15));
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);
    }

    .sync-btn.import {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(99, 102, 241, 0.15));
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.2);
    }

    .sync-btn.analytics {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(251, 191, 36, 0.15));
      border-color: rgba(251, 191, 36, 0.4);
      box-shadow: 0 4px 20px rgba(251, 191, 36, 0.2);
    }

    .pane {
      background: linear-gradient(135deg, rgba(30, 30, 30, 0.95) 0%, rgba(15, 15, 15, 0.98) 100%);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 
        0 24px 64px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pane::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    }

    .pane::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05), transparent 70%);
      pointer-events: none;
    }

    .pane.current {
      border-color: rgba(251, 191, 36, 0.4);
      box-shadow: 
        0 24px 64px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(251, 191, 36, 0.15),
        inset 0 1px 0 rgba(251, 191, 36, 0.2);
    }

    .pane.current::before {
      background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.4), transparent);
    }

    .pane.monthly {
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 
        0 24px 64px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(59, 130, 246, 0.15),
        inset 0 1px 0 rgba(59, 130, 246, 0.2);
    }

    .pane.monthly::before {
      background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.4), transparent);
    }

    .pane:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 32px 80px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .pane-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      z-index: 1;
    }

    .pane-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.8px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .star-toggle {
      font-size: 1.8rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      filter: grayscale(100%) brightness(0.5);
    }

    .star-toggle:hover {
      transform: scale(1.2) rotate(15deg);
      filter: grayscale(0%) brightness(1);
    }

    .star-toggle.active {
      filter: grayscale(0%) brightness(1);
      animation: pulse 2s ease-in-out infinite;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.15);
      }
    }

    .period-dates {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .period-dates-label {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .period-dates-value {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .summary-item {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 4px 16px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .summary-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .summary-item:hover::before {
      opacity: 1;
    }

    .summary-item:hover {
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 
        0 8px 24px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .summary-label {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 600;
    }

    .summary-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    .summary-value.positive {
      color: #10b981;
      text-shadow: 0 2px 12px rgba(16, 185, 129, 0.4);
    }

    .summary-value.negative {
      color: #ef4444;
      text-shadow: 0 2px 12px rgba(239, 68, 68, 0.4);
    }

    .input-group {
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .input-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 8px;
      display: block;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input, select {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    input:focus, select:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 
        inset 0 2px 8px rgba(0, 0, 0, 0.15),
        0 0 0 4px rgba(255, 255, 255, 0.05);
      transform: translateY(-1px);
    }

    select option {
      background: #1a1a1a;
      color: #fff;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #ffffff, #f0f0f0);
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 4px 16px rgba(255, 255, 255, 0.15),
        0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn:hover::before {
      opacity: 1;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 
        0 6px 20px rgba(255, 255, 255, 0.2),
        0 12px 32px rgba(0, 0, 0, 0.3);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .expenses-list {
      max-height: 350px;
      overflow-y: auto;
      margin-top: 20px;
      padding-right: 8px;
      position: relative;
      z-index: 1;
    }

    .expense-item {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
    }

    .expense-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .expense-item:hover::before {
      opacity: 1;
    }

    .expense-item:hover {
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateX(6px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .expense-info {
      flex: 1;
    }

    .expense-desc {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .expense-cat {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .expense-amount {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-right: 12px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .delete-btn {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.15));
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.2);
    }

    .delete-btn:hover {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(239, 68, 68, 0.2));
      border-color: rgba(239, 68, 68, 0.4);
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: rgba(255, 255, 255, 0.35);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.5;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
    }

    .expenses-list::-webkit-scrollbar {
      width: 6px;
    }

    .expenses-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 3px;
    }

    .expenses-list::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.1));
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .expenses-list::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.15));
    }

    .month-nav {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .month-nav button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    .month-nav button:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.1);
    }

    .month-display {
      font-size: 1.1rem;
      font-weight: 600;
      min-width: 140px;
      text-align: center;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: linear-gradient(135deg, rgba(30, 30, 30, 0.98) 0%, rgba(15, 15, 15, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 40px;
      max-width: 800px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 32px 96px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
    }

    .close-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .close-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      transform: rotate(90deg);
    }

    .analytics-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .analytics-table th,
    .analytics-table td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .analytics-table th {
      background: rgba(255, 255, 255, 0.05);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
    }

    .analytics-table td {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .analytics-table tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .analytics-table td:last-child {
      font-weight: 700;
      color: #10b981;
    }

    @media (max-width: 1400px) {
      .container {
        grid-template-columns: 1fr 1fr;
      }
      
      .pane.monthly {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .analytics-table {
        font-size: 0.85rem;
      }

      .analytics-table th,
      .analytics-table td {
        padding: 12px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sync Bar -->
    <div class="sync-bar">
      <button class="sync-btn analytics" onclick="showAnalytics()">
        📊 View Analytics
      </button>
      <button class="sync-btn export" onclick="exportData()">
        📥 Export Data
      </button>
      <button class="sync-btn import" onclick="document.getElementById('import-file').click()">
        📤 Import Data
      </button>
      <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
    </div>

    <!-- Left Pane: Bi-Weekly 1 -->
    <div class="pane" id="pane-1">
      <div class="pane-header">
        <div class="pane-title">Bi-Weekly 1</div>
        <div class="star-toggle" id="star-1" onclick="togglePeriod(1)">⭐</div>
      </div>

      <div class="period-dates">
        <div class="period-dates-label">Period Dates</div>
        <div class="period-dates-value" id="period-1-dates">Loading...</div>
      </div>

      <div class="summary">
        <div class="summary-item">
          <div class="summary-label">Salary</div>
          <div class="summary-value" id="salary-1">$0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Expenses</div>
          <div class="summary-value" id="expenses-1">$0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Savings</div>
          <div class="summary-value" id="savings-1">$0</div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Salary</label>
        <input type="number" id="salary-input-1" placeholder="Enter salary" step="0.01">
      </div>

      <div class="input-group">
        <label class="input-label">Category</label>
        <input type="text" id="category-1" placeholder="e.g., Groceries, Rent">
      </div>

      <div class="input-group">
        <label class="input-label">Amount</label>
        <input type="number" id="amount-1" placeholder="0.00" step="0.01">
      </div>

      <button class="btn" onclick="addExpense(1)">Add Expense</button>

      <div class="expenses-list" id="expenses-list-1">
        <div class="empty-state">
          <div class="empty-state-icon">📊</div>
          <div>No expenses yet</div>
        </div>
      </div>
    </div>

    <!-- Right Pane: Bi-Weekly 2 -->
    <div class="pane" id="pane-2">
      <div class="pane-header">
        <div class="pane-title">Bi-Weekly 2</div>
        <div class="star-toggle" id="star-2" onclick="togglePeriod(2)">⭐</div>
      </div>

      <div class="period-dates">
        <div class="period-dates-label">Period Dates</div>
        <div class="period-dates-value" id="period-2-dates">Loading...</div>
      </div>

      <div class="summary">
        <div class="summary-item">
          <div class="summary-label">Salary</div>
          <div class="summary-value" id="salary-2">$0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Expenses</div>
          <div class="summary-value" id="expenses-2">$0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Savings</div>
          <div class="summary-value" id="savings-2">$0</div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Salary</label>
        <input type="number" id="salary-input-2" placeholder="Enter salary" step="0.01">
      </div>

      <div class="input-group">
        <label class="input-label">Category</label>
        <input type="text" id="category-2" placeholder="e.g., Groceries, Rent">
      </div>

      <div class="input-group">
        <label class="input-label">Amount</label>
        <input type="number" id="amount-2" placeholder="0.00" step="0.01">
      </div>

      <button class="btn" onclick="addExpense(2)">Add Expense</button>

      <div class="expenses-list" id="expenses-list-2">
        <div class="empty-state">
          <div class="empty-state-icon">📊</div>
          <div>No expenses yet</div>
        </div>
      </div>
    </div>

    <!-- Third Pane: Monthly Utilities -->
    <div class="pane monthly" id="pane-monthly">
      <div class="pane-header">
        <div class="pane-title">Monthly Utilities</div>
      </div>

      <div class="month-nav">
        <button onclick="changeMonth(-1)">◀</button>
        <div class="month-display" id="month-display">Loading...</div>
        <button onclick="changeMonth(1)">▶</button>
      </div>

      <div class="summary">
        <div class="summary-item">
          <div class="summary-label">Total Bills</div>
          <div class="summary-value" id="monthly-total">$0</div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Utility Type</label>
        <select id="utility-type">
          <option value="">Select utility...</option>
          <option value="💧 Water">💧 Water</option>
          <option value="🔥 Gas">🔥 Gas</option>
          <option value="⚡ Hydro">⚡ Hydro</option>
          <option value="📡 Internet">📡 Internet</option>
          <option value="📱 Phone">📱 Phone</option>
          <option value="🏠 Home Insurance">🏠 Home Insurance</option>
          <option value="🚗 Car Insurance">🚗 Car Insurance</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="input-group" id="custom-utility-group" style="display: none;">
        <label class="input-label">Custom Utility</label>
        <input type="text" id="custom-utility" placeholder="Enter utility name">
      </div>

      <div class="input-group">
        <label class="input-label">Amount</label>
        <input type="number" id="utility-amount" placeholder="0.00" step="0.01">
      </div>

      <button class="btn" onclick="addUtility()">Add Utility</button>

      <div class="expenses-list" id="utilities-list">
        <div class="empty-state">
          <div class="empty-state-icon">💡</div>
          <div>No utilities yet</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Analytics Modal -->
  <div id="analytics-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Utility Analytics - Yearly Averages</div>
        <button class="close-btn" onclick="closeAnalytics()">✕</button>
      </div>
      <div id="analytics-body">
        <!-- Analytics table will be inserted here -->
      </div>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let salaries = JSON.parse(localStorage.getItem('salaries')) || {};
    let utilities = JSON.parse(localStorage.getItem('utilities')) || [];
    let settings = JSON.parse(localStorage.getItem('paySettings')) || {
      startDate: '2025-12-24'
    };

    let paneStates = JSON.parse(localStorage.getItem('paneStates')) || {
      pane1Offset: 0,
      pane2Offset: 1
    };

    let pane1Offset = paneStates.pane1Offset;
    let pane2Offset = paneStates.pane2Offset;
    let currentMonthOffset = 0;

    document.getElementById('utility-type').addEventListener('change', function() {
      const customGroup = document.getElementById('custom-utility-group');
      if (this.value === 'Other') {
        customGroup.style.display = 'block';
      } else {
        customGroup.style.display = 'none';
      }
    });

    function showAnalytics() {
      const modal = document.getElementById('analytics-modal');
      const body = document.getElementById('analytics-body');
      
      // Group utilities by type
      const utilityGroups = {};
      utilities.forEach(util => {
        if (!utilityGroups[util.type]) {
          utilityGroups[util.type] = [];
        }
        utilityGroups[util.type].push(util.amount);
      });
      
      // Calculate averages
      const analytics = Object.keys(utilityGroups).map(type => {
        const amounts = utilityGroups[type];
        const sum = amounts.reduce((acc, curr) => acc + curr, 0);
        const avg = sum / amounts.length;
        const count = amounts.length;
        const total = sum;
        
        return {
          type,
          count,
          average: avg,
          total: total
        };
      }).sort((a, b) => b.average - a.average);
      
      if (analytics.length === 0) {
        body.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📊</div>
            <div>No utility data yet. Start adding monthly utilities to see analytics!</div>
          </div>
        `;
      } else {
        const totalAvg = analytics.reduce((sum, item) => sum + item.average, 0);
        
        body.innerHTML = `
          <table class="analytics-table">
            <thead>
              <tr>
                <th>Utility</th>
                <th>Months Tracked</th>
                <th>Total Spent</th>
                <th>Average/Month</th>
              </tr>
            </thead>
            <tbody>
              ${analytics.map(item => `
                <tr>
                  <td>${item.type}</td>
                  <td>${item.count} month${item.count !== 1 ? 's' : ''}</td>
                  <td>$${item.total.toFixed(2)}</td>
                  <td>$${item.average.toFixed(2)}</td>
                </tr>
              `).join('')}
            </tbody>
            <tfoot>
              <tr style="border-top: 2px solid rgba(255,255,255,0.2); font-weight: 700;">
                <td>Total Monthly Average</td>
                <td></td>
                <td></td>
                <td style="font-size: 1.1rem;">$${totalAvg.toFixed(2)}</td>
              </tr>
            </tfoot>
          </table>
        `;
      }
      
      modal.classList.add('active');
    }

    function closeAnalytics() {
      document.getElementById('analytics-modal').classList.remove('active');
    }

    // Close modal on outside click
    window.onclick = function(event) {
      const modal = document.getElementById('analytics-modal');
      if (event.target === modal) {
        closeAnalytics();
      }
    }

    function savePaneStates() {
      localStorage.setItem('paneStates', JSON.stringify({
        pane1Offset: pane1Offset,
        pane2Offset: pane2Offset
      }));
    }

    function exportData() {
      const data = {
        transactions,
        salaries,
        utilities,
        settings,
        paneStates: { pane1Offset, pane2Offset },
        exportDate: new Date().toISOString(),
        version: '1.1'
      };
      
      const dataStr = JSON.stringify(data, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const filename = `expense-tracker-${new Date().toISOString().split('T')[0]}.json`;
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
      
      alert('✅ Data exported! Transfer this file to your other device and import it.');
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          
          if (confirm('Import data? This will replace your current data on this device.')) {
            transactions = imported.transactions || [];
            salaries = imported.salaries || {};
            utilities = imported.utilities || [];
            settings = imported.settings || { startDate: '2025-12-24' };
            
            if (imported.paneStates) {
              pane1Offset = imported.paneStates.pane1Offset || 0;
              pane2Offset = imported.paneStates.pane2Offset || 1;
            }
            
            localStorage.setItem('transactions', JSON.stringify(transactions));
            localStorage.setItem('salaries', JSON.stringify(salaries));
            localStorage.setItem('utilities', JSON.stringify(utilities));
            localStorage.setItem('paySettings', JSON.stringify(settings));
            savePaneStates();
            
            updateDisplay();
            updateMonthlyDisplay();
            alert('✅ Data imported successfully!');
          }
        } catch (error) {
          alert('❌ Error importing file. Make sure it\'s a valid expense tracker file.');
          console.error(error);
        }
      };
      reader.readAsText(file);
      
      event.target.value = '';
    }

    function togglePeriod(paneNum) {
      if (paneNum === 1) {
        pane1Offset = pane1Offset === 0 ? 1 : 0;
        pane2Offset = pane1Offset === 0 ? 1 : 0;
      } else {
        pane2Offset = pane2Offset === 0 ? 1 : 0;
        pane1Offset = pane2Offset === 0 ? 1 : 0;
      }
      
      savePaneStates();
      updateDisplay();
    }

    function getPeriod(offset = 0) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      const startDate = new Date(settings.startDate + 'T00:00:00');
      const millisDiff = today.getTime() - startDate.getTime();
      const daysDiff = Math.floor(millisDiff / (1000 * 60 * 60 * 24));
      const currentPeriodNum = Math.floor(daysDiff / 14);
      const targetPeriod = currentPeriodNum + offset;
      
      const periodStart = new Date(startDate);
      periodStart.setDate(periodStart.getDate() + (targetPeriod * 14));
      
      const periodEnd = new Date(periodStart);
      periodEnd.setDate(periodEnd.getDate() + 13);
      periodEnd.setHours(23, 59, 59, 999);
      
      return {
        start: periodStart,
        end: periodEnd,
        key: `period-${periodStart.getFullYear()}-${String(periodStart.getMonth() + 1).padStart(2, '0')}-${String(periodStart.getDate()).padStart(2, '0')}`
      };
    }

    function getMonth(offset = 0) {
      const today = new Date();
      const month = new Date(today.getFullYear(), today.getMonth() + offset, 1);
      return {
        year: month.getFullYear(),
        month: month.getMonth(),
        key: `${month.getFullYear()}-${String(month.getMonth() + 1).padStart(2, '0')}`,
        display: month.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
      };
    }

    function formatDate(date) {
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function changeMonth(direction) {
      currentMonthOffset += direction;
      updateMonthlyDisplay();
    }

    function checkPeriodRollover() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      const currentPeriod = getPeriod(0);
      
      if (today > currentPeriod.end) {
        console.log('Period ended - auto-advancing...');
        pane1Offset = Math.max(0, pane1Offset - 1);
        pane2Offset = Math.max(0, pane2Offset - 1);
        savePaneStates();
      }
    }

    function updateDisplay() {
      updatePane(1, pane1Offset);
      updatePane(2, pane2Offset);
    }

    function updatePane(paneNum, offset) {
      const period = getPeriod(offset);
      const pane = document.getElementById(`pane-${paneNum}`);
      const star = document.getElementById(`star-${paneNum}`);
      
      document.getElementById(`period-${paneNum}-dates`).textContent = 
        `${formatDate(period.start)} - ${formatDate(period.end)}`;
      
      if (offset === 0) {
        star.classList.add('active');
        pane.classList.add('current');
      } else {
        star.classList.remove('active');
        pane.classList.remove('current');
      }
      
      const salary = salaries[period.key] || 0;
      document.getElementById(`salary-input-${paneNum}`).value = salary || '';
      
      const periodExpenses = transactions.filter(t => {
        const tDate = new Date(t.date);
        tDate.setHours(0, 0, 0, 0);
        return tDate >= period.start && tDate <= period.end;
      });
      
      const totalExpenses = periodExpenses.reduce((sum, t) => sum + t.amount, 0);
      const savings = salary - totalExpenses;
      
      document.getElementById(`salary-${paneNum}`).textContent = `$${salary.toFixed(0)}`;
      document.getElementById(`expenses-${paneNum}`).textContent = `$${totalExpenses.toFixed(0)}`;
      
      const savingsEl = document.getElementById(`savings-${paneNum}`);
      savingsEl.textContent = `$${savings.toFixed(0)}`;
      savingsEl.className = 'summary-value ' + (savings >= 0 ? 'positive' : 'negative');
      
      renderExpenses(paneNum, periodExpenses);
    }

    function updateMonthlyDisplay() {
      const month = getMonth(currentMonthOffset);
      document.getElementById('month-display').textContent = month.display;
      
      const monthUtilities = utilities.filter(u => u.month === month.key);
      const total = monthUtilities.reduce((sum, u) => sum + u.amount, 0);
      
      document.getElementById('monthly-total').textContent = `$${total.toFixed(0)}`;
      
      renderUtilities(monthUtilities);
    }

    function renderExpenses(paneNum, expenses) {
      const listEl = document.getElementById(`expenses-list-${paneNum}`);
      
      if (expenses.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📊</div>
            <div>No expenses yet</div>
          </div>
        `;
        return;
      }
      
      listEl.innerHTML = expenses.slice().reverse().map(exp => {
        const actualIndex = transactions.findIndex(t => t.id === exp.id);
        return `
          <div class="expense-item">
            <div class="expense-info">
              <div class="expense-desc">${exp.category}</div>
              <div class="expense-cat">${new Date(exp.date).toLocaleDateString()}</div>
            </div>
            <div class="expense-amount">$${exp.amount.toFixed(2)}</div>
            <button class="delete-btn" onclick="deleteExpense(${actualIndex})">✕</button>
          </div>
        `;
      }).join('');
    }

    function renderUtilities(utilityList) {
      const listEl = document.getElementById('utilities-list');
      
      if (utilityList.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">💡</div>
            <div>No utilities yet</div>
          </div>
        `;
        return;
      }
      
      listEl.innerHTML = utilityList.map(util => {
        const actualIndex = utilities.findIndex(u => u.id === util.id);
        return `
          <div class="expense-item">
            <div class="expense-info">
              <div class="expense-desc">${util.type}</div>
              <div class="expense-cat">${util.month}</div>
            </div>
            <div class="expense-amount">$${util.amount.toFixed(2)}</div>
            <button class="delete-btn" onclick="deleteUtility(${actualIndex})">✕</button>
          </div>
        `;
      }).join('');
    }

    function addExpense(paneNum) {
      const offset = paneNum === 1 ? pane1Offset : pane2Offset;
      const period = getPeriod(offset);
      
      const category = document.getElementById(`category-${paneNum}`).value.trim();
      const amount = parseFloat(document.getElementById(`amount-${paneNum}`).value);
      
      if (!category || !amount || amount <= 0) {
        alert('Please enter both category and amount');
        return;
      }
      
      const transaction = {
        id: Date.now(),
        category,
        amount,
        date: period.start.toISOString()
      };
      
      transactions.push(transaction);
      localStorage.setItem('transactions', JSON.stringify(transactions));
      
      document.getElementById(`category-${paneNum}`).value = '';
      document.getElementById(`amount-${paneNum}`).value = '';
      
      updateDisplay();
    }

    function addUtility() {
      const typeSelect = document.getElementById('utility-type');
      let type = typeSelect.value;
      
      if (!type) {
        alert('Please select a utility type');
        return;
      }
      
      if (type === 'Other') {
        type = document.getElementById('custom-utility').value.trim();
        if (!type) {
          alert('Please enter a custom utility name');
          return;
        }
      }
      
      const amount = parseFloat(document.getElementById('utility-amount').value);
      
      if (!amount || amount <= 0) {
        alert('Please enter an amount');
        return;
      }
      
      const month = getMonth(currentMonthOffset);
      
      const utility = {
        id: Date.now(),
        type,
        amount,
        month: month.key
      };
      
      utilities.push(utility);
      localStorage.setItem('utilities', JSON.stringify(utilities));
      
      typeSelect.value = '';
      document.getElementById('custom-utility').value = '';
      document.getElementById('utility-amount').value = '';
      document.getElementById('custom-utility-group').style.display = 'none';
      
      updateMonthlyDisplay();
    }

    function deleteExpense(index) {
      if (index < 0 || index >= transactions.length) {
        console.error('Invalid index:', index);
        alert('Error deleting expense. Please refresh the page.');
        return;
      }
      
      if (confirm('Delete this expense?')) {
        const deleted = transactions.splice(index, 1);
        console.log('Deleted expense:', deleted);
        localStorage.setItem('transactions', JSON.stringify(transactions));
        updateDisplay();
      }
    }

    function deleteUtility(index) {
      if (index < 0 || index >= utilities.length) {
        console.error('Invalid index:', index);
        alert('Error deleting utility. Please refresh the page.');
        return;
      }
      
      if (confirm('Delete this utility bill?')) {
        const deleted = utilities.splice(index, 1);
        console.log('Deleted utility:', deleted);
        localStorage.setItem('utilities', JSON.stringify(utilities));
        updateMonthlyDisplay();
      }
    }

    document.getElementById('salary-input-1').addEventListener('change', function() {
      const period = getPeriod(pane1Offset);
      salaries[period.key] = parseFloat(this.value) || 0;
      localStorage.setItem('salaries', JSON.stringify(salaries));
      updateDisplay();
    });

    document.getElementById('salary-input-2').addEventListener('change', function() {
      const period = getPeriod(pane2Offset);
      salaries[period.key] = parseFloat(this.value) || 0;
      localStorage.setItem('salaries', JSON.stringify(salaries));
      updateDisplay();
    });

    document.getElementById('amount-1').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addExpense(1);
    });

    document.getElementById('amount-2').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addExpense(2);
    });

    document.getElementById('utility-amount').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addUtility();
    });

    checkPeriodRollover();
    updateDisplay();
    updateMonthlyDisplay();
    setInterval(checkPeriodRollover, 3600000);
  </script>
</body>
</html>
